aid: shipyard-software
name: Shipyard Software
description: >-
  Shipyard Software is the DeFi technology company behind Clipper, a
  decentralized exchange (DEX) designed for retail traders that offers
  blue-chip token swaps with no impermanent loss for liquidity providers.
  Founded in 2021 by Mark Lurie and backed by Polychain and others, Shipyard
  built market-making technology across eight blockchains before being
  acquired by Sushi Labs in January 2025. Clipper, now governed by AdmiralDAO,
  exposes a Request-for-Quote (RFQ) swap API for DEX aggregators and a
  Graph-hosted GraphQL subgraph for querying on-chain pool data.
