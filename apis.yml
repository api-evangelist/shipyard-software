apis:
- aid: shipyard-software:clipper-rfq-api
  name: Clipper RFQ API
  description: >-
    Request-for-Quote swap API for the Clipper DEX. Aggregators retrieve pool
    state (price feeds, k factor), request firm quotes, and sign quotes to
    obtain the EIP-2098 signature/calldata needed to execute swaps against
    Clipper pool contracts on Ethereum, Polygon, Optimism, Mantle, and
    Arbitrum. API v2 is served from blade-api.sushi.com with x-api-key
    authentication; API v1 remains at api.clipper.exchange.
  humanURL: https://docs.clipper.exchange/disclaimers-and-technical/integrating-with-clipper-rfq
  baseURL: https://blade-api.sushi.com
  tags:
  - DeFi
  - DEX
  - Swaps
  - RFQ
  - Quotes
  properties:
  - type: Documentation
    url: https://docs.clipper.exchange/disclaimers-and-technical/integrating-with-clipper-rfq
  - type: APIReference
    url: https://docs.clipper.exchange/disclaimers-and-technical/integrating-with-clipper-rfq/api-reference/api-v2/overview
  - type: GettingStarted
    url: https://docs.clipper.exchange/disclaimers-and-technical/integrating-with-clipper-rfq/guides/how-to-use-clipper-rfq-api
- aid: shipyard-software:clipper-subgraph
  name: Clipper Subgraph (GraphQL)
  description: >-
    GraphQL API endpoints hosted on The Graph that index Clipper's smart
    contracts across Ethereum, Optimism, Polygon, and Arbitrum — pools, swaps,
    deposits, withdrawals, volume, and fee data for analytics and integrations.
  humanURL: https://docs.clipper.exchange/disclaimers-and-technical/smart-contracts/subgraph
  baseURL: https://api.thegraph.com/subgraphs/name/edoapp/clipper
  tags:
  - GraphQL
  - Subgraph
  - Analytics
  - DeFi
  properties:
